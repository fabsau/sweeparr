services:
  sweeparr:
    image: ghcr.io/fabsau/sweeparr:0.9
    container_name: sweeparr
    restart: unless-stopped

    # Read-only root filesystem & minimal Linux capabilities.
    # Entrypoint drops privileges via su-exec to PUID:PGID (default 1000:1000) and refuses root (0).
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m

    environment:
      TZ: "UTC"
      PUID: "1000"
      PGID: "1000"
      SWEEPARR_PORT: "8080"
      SWEEPARR_STATE_DIR: "/state"
      # Option A (IaC): Mount config.yaml below and point to it here.
      SWEEPARR_CONFIG_FILE: "/config/config.yaml"

      # Option B (UI-managed, no config.yaml needed): Comment out SWEEPARR_CONFIG_FILE
      # and the config.yaml volume, then configure via env vars instead:
      # SWEEPARR_PUBLIC_URL: "https://sweeparr.example.com"  # auto-derives WebAuthn rp_id & rp_origins
      # PLEX_URL: "https://plex.internal:32400"
      # PLEX_TOKEN_FILE: "/run/secrets/plex_token"           # or PLEX_TOKEN: "YOUR_PLEX_TOKEN" (less secure)
      # PLEX_SSL_VERIFY: "true"
      # SWEEPARR_MASTER_KEY_FILE: "/run/secrets/sweeparr_master_key"  # or auto-generated in /state if omitted
      # SWEEPARR_ADMIN_USER: "admin"                         # optional; otherwise use the first-run Web UI wizard
      # SWEEPARR_ADMIN_PASSWORD_FILE: "/run/secrets/sweeparr_admin_password"  # or SWEEPARR_ADMIN_PASSWORD: "..."

    volumes:
      - ./state:/state
      - ./config.yaml:/config/config.yaml:ro
      # Optional: read-only media mount ONLY if you enable hold_modified_files
      # - /srv/media:/media:ro

    secrets:
      - sweeparr_master_key
      - sweeparr_admin_password
      - plex_token

    # Expose only on localhost (or omit ports entirely and put behind your reverse proxy)
    ports:
      - "127.0.0.1:8080:8080"

    # Optional: attach to an internal-only Docker network (no internet egress needed!)
    networks:
      - media_internal

    healthcheck:
      test: ["CMD", "/app/sweeparr", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  sweeparr_master_key:
    file: ./secrets/sweeparr_master_key.txt       # openssl rand -hex 32
  sweeparr_admin_password:
    file: ./secrets/sweeparr_admin_password.txt   # >= 10 chars
  plex_token:
    file: ./secrets/plex_token.txt                # X-Plex-Token

networks:
  media_internal:
    # Set internal: true to completely block internet egress (Sweeparr works 100% offline!)
    internal: true
