name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Build & Locale Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run Frontend Unit & Component Tests
        working-directory: web
        run: npm test

      - name: Typecheck & Build
        working-directory: web
        run: npm run build

      - name: Verify 5-locale key parity
        run: |
          python3 - << 'PY'
          import glob, re, sys
          locales = {}
          for path in sorted(glob.glob("web/src/locales/*.ts")):
              with open(path, encoding="utf-8") as f:
                  locales[path] = set(re.findall(r'^\s*"([^"]+)":', f.read(), re.M))
          base_path = "web/src/locales/en.ts"
          base = locales[base_path]
          failed = False
          for path, keys in locales.items():
              missing = sorted(base - keys)
              extra = sorted(keys - base)
              if missing or extra:
                  print(f"Locale parity mismatch in {path}: missing={missing}, extra={extra}")
                  failed = True
          if failed:
              sys.exit(1)
          print(f"All {len(locales)} locales have 100% parity ({len(base)} keys).")
          PY

  backend:
    name: Go Vet & Race Tests
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build embedded web UI
        working-directory: web
        run: npm ci && npm run build

      - name: Go Vet
        run: go vet ./...

      - name: Go Test (race)
        run: go test -race -count=1 ./...

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=cacheonly
          cache-from: type=gha
          cache-to: type=gha,mode=max
