name: Release & Docker Publish

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please (SemVer & Changelog)
    permissions:
      contents: write
      pull-requests: write
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker:
    name: Build, Scan & Publish Docker Image (GHCR)
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      security-events: write
    needs: [release-please]
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/v') || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: fabsau/sweeparr
    steps:
      - name: Determine release tag
        id: rel
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="$RELEASE_TAG"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$ ]] || exit 1
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ steps.rel.outputs.tag }}
          fetch-depth: 0

      - name: Read release revision
        id: revision
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (latest, major, minor, full SemVer)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ steps.rel.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.rel.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.rel.outputs.tag }}

      - name: Build local image for Trivy vulnerability scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: sweeparr:scan
          build-args: |
            VERSION=${{ steps.rel.outputs.version }}
            COMMIT=${{ steps.revision.outputs.commit }}
            BUILD_DATE=${{ steps.revision.outputs.date }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sweeparr:scan
          version: v0.76.2
          format: sarif
          output: trivy-image.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: ${{ !cancelled() && hashFiles('trivy-image.sarif') != '' }}
        with:
          sarif_file: trivy-image.sarif

      - name: Build and push multi-arch Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.rel.outputs.version }}
            COMMIT=${{ steps.revision.outputs.commit }}
            BUILD_DATE=${{ steps.revision.outputs.date }}

      - name: Attest Docker image build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  binaries:
    name: Build & Attach Release Binaries
    permissions:
      contents: write
    needs: [release-please, docker]
    if: >-
      !cancelled() && needs.docker.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Determine release tag
        id: rel
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="$RELEASE_TAG"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$ ]] || exit 1
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ steps.rel.outputs.tag }}

      - name: Read release revision
        id: revision
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web frontend
        working-directory: web
        run: npm ci && npm run build

      - name: Build static Linux binaries (amd64 & arm64)
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/fabsau/sweeparr/internal/version.Version=${{ steps.rel.outputs.version }} -X github.com/fabsau/sweeparr/internal/version.Commit=${{ steps.revision.outputs.commit }}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags="${LDFLAGS}" -o dist/sweeparr-linux-amd64 ./cmd/sweeparr
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -ldflags="${LDFLAGS}" -o dist/sweeparr-linux-arm64 ./cmd/sweeparr
          (cd dist && sha256sum sweeparr-linux-* > checksums.txt)

      - name: Attach binaries and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          assets=(dist/sweeparr-linux-amd64 dist/sweeparr-linux-arm64 dist/checksums.txt)
          if release=$(gh release view "$RELEASE_TAG" --json isDraft,assets 2>/dev/null); then
            if [[ "$(jq -r .isDraft <<< "$release")" == false ]]; then
              for asset in "${assets[@]}"; do
                jq -e --arg name "${asset##*/}" 'any(.assets[]; .name == $name)' <<< "$release" >/dev/null
              done
              echo "Release $RELEASE_TAG is already published with all required assets"
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
