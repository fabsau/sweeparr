name: Security Monitoring

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/autobuild@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5

      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          govulncheck ./...

  npm-audit:
    name: Frontend Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Audit npm dependencies
        working-directory: web
        run: npm audit --audit-level=high

  trivy-fs:
    name: Trivy Filesystem & IaC Scan
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          trivyignores: .trivyignore.yaml
          scanners: vuln,misconfig,secret
          version: v0.76.2
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH

      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: ${{ !cancelled() && hashFiles('trivy-fs.sarif') != '' }}
        with:
          sarif_file: trivy-fs.sarif

  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download and verify Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: v8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          asset="gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          gh release download "$GITLEAKS_VERSION" --repo gitleaks/gitleaks --pattern "$asset" --dir "$RUNNER_TEMP"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/$asset" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" gitleaks

      - name: Scan Git history
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          args=()
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base=$(git merge-base "$PR_BASE" "$PR_HEAD")
              args+=("--log-opts=$base..$PR_HEAD")
              ;;
            push)
              if [[ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]] &&
                 git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                args+=("--log-opts=$PUSH_BEFORE..$GITHUB_SHA")
              fi
              ;;
          esac
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner "${args[@]}"
