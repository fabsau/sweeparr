name: Bug Report
description: Report a bug or unexpected behavior in Sweeparr.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the details below so we can reproduce and fix it quickly.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what happened vs. what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Observe error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sweeparr Version
      placeholder: "e.g. v0.9.0 (from sidebar or `sweeparr -version`)"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Method
      options:
        - Docker / Docker Compose (GHCR image)
        - Kubernetes
        - Standalone Binary
        - Built from Source
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Browser Console Output
      description: Please redact any tokens, cookies, or private hostnames before pasting.
      render: shell
